version: v1

plugins:
  # Go 用
  - plugin: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
  - plugin: buf.build/connectrpc/go
    out: gen
    opt: paths=source_relative
  # TypeScript 用
  - plugin: es
    out: frontend/gen
    opt: target=ts
    path: frontend/node_modules/.bin/protoc-gen-es

  - plugin: connect-es
    out: frontend/gen
    opt: target=ts
    path: frontend/node_modules/.bin/protoc-gen-connect-es
 